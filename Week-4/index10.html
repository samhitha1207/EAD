<!DOCTYPE html>
<html>
<head>
    <title>Navigation Bar with Dropdown</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }
        nav {
            background-color: #1f3c88;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
        }
        ul li {
            position: relative;
        }
        ul li a {
            display: block;
            padding: 15px 20px;
            color: white;
            text-decoration: none;
        }
        ul li a:hover {
            background-color: #4a69bd;
        }
        ul li ul {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background-color: #4a69bd;
            min-width: 160px;
            flex-direction: column;
        }
        ul li ul li a {
            padding: 12px 16px;
        }
        ul li:hover ul {
            display: block;
        }
        ul li ul li a:hover {
            background-color: #6a89cc;
        }
    </style>
</head>
<body>
<nav>
    <ul>
        <li><a href="#">Home</a></li>
        <li>
            <a href="#">Courses</a>
            <ul>
                <li><a href="#">HTML</a></li>
                <li><a href="#">CSS</a></li>
                <li><a href="#">JavaScript</a></li>
                <li><a href="#">MERN Stack</a></li>
            </ul>
        </li>
        <li><a href="#">About</a></li>
        <li><a href="#">Contact</a></li>
    </ul>
</nav>
</body>
</html>
